services:
  postgres:
    image: postgres:16-alpine
    container_name: obd-gateway-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: obd
      POSTGRES_PASSWORD: obd
      POSTGRES_DB: obd_gateway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obd -d obd_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
